<meta charset="utf-8">
<title>Salonbyggeren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F5F4F7; --surface:#FFFFFF; --surface-2:#EEECF4; --surface-3:#E5E2EE;
  --line:#DEDAE8; --line-strong:#C3BCD4;
  --ink:#1B1722; --ink-2:#4B4459; --ink-3:#7B7389;
  --accent:#5A3FA0; --accent-2:#3E2B72; --accent-soft:#EBE5FA; --on-accent:#FFFFFF;
  --good:#1F6B4E; --good-soft:#E0F0E8;
  --warn:#8A5A10; --warn-soft:#F7EBD6;
  --crit:#992E3D; --crit-soft:#F8E3E6;
  --brass:#7E6224; --brass-soft:#F3EDDC;
  --shadow-sm:0 1px 2px rgba(27,23,34,.06);
  --shadow:0 1px 2px rgba(27,23,34,.05), 0 10px 28px -16px rgba(27,23,34,.30);
  --radius:10px;
  --serif:"Bodoni Moda", "Times New Roman", serif;
  --sans:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141119; --surface:#1D1926; --surface-2:#262133; --surface-3:#2F2940;
    --line:#332C44; --line-strong:#4A4160;
    --ink:#F2EFF7; --ink-2:#BEB6CD; --ink-3:#8C8499;
    --accent:#B49BF5; --accent-2:#CDBBFF; --accent-soft:#2B2242; --on-accent:#1A1424;
    --good:#6FD4A7; --good-soft:#15302A;
    --warn:#E6B468; --warn-soft:#332710;
    --crit:#F19BA7; --crit-soft:#3A1E24;
    --brass:#D8B36B; --brass-soft:#2E2716;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#141119; --surface:#1D1926; --surface-2:#262133; --surface-3:#2F2940;
  --line:#332C44; --line-strong:#4A4160;
  --ink:#F2EFF7; --ink-2:#BEB6CD; --ink-3:#8C8499;
  --accent:#B49BF5; --accent-2:#CDBBFF; --accent-soft:#2B2242; --on-accent:#1A1424;
  --good:#6FD4A7; --good-soft:#15302A;
  --warn:#E6B468; --warn-soft:#332710;
  --crit:#F19BA7; --crit-soft:#3A1E24;
  --brass:#D8B36B; --brass-soft:#2E2716;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:500}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---------- chrome ---------- */
.proto{
  background:var(--ink); color:var(--ground);
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  padding:7px 20px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; text-align:center;
}
.proto span{opacity:.62}
.masthead{
  border-bottom:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; z-index:30;
}
.masthead-in{
  max-width:1200px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:18px; justify-content:space-between;
}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand b{font-family:var(--serif); font-size:21px; font-weight:500; letter-spacing:.01em}
.brand em{
  font-family:var(--mono); font-style:normal; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
}
.steps{display:flex; gap:6px; align-items:center; list-style:none; margin:0; padding:0}
.steps li{
  width:34px; height:4px; border-radius:2px; background:var(--surface-3);
}
.steps li.done{background:var(--accent)}
.steps li.now{background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.step-label{font-family:var(--mono); font-size:11px; color:var(--ink-3); letter-spacing:.06em; white-space:nowrap}
@media(max-width:720px){ .steps{display:none} }

/* ---------- layout ---------- */
.wrap{max-width:1200px; margin:0 auto; padding:34px 24px 90px}
.bench{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:44px; align-items:start}
@media(max-width:1000px){ .bench{grid-template-columns:1fr; gap:30px} }
.bench.solo{grid-template-columns:minmax(0,1fr)}
.bench.solo .stage{max-width:900px}

.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin-bottom:12px; display:flex; gap:9px; align-items:center;
}
.eyebrow::before{content:""; width:20px; height:1px; background:var(--accent); flex:none}
.stage h2{font-family:var(--serif); font-size:clamp(28px,3.6vw,40px); line-height:1.12; letter-spacing:-.01em}
.lede{color:var(--ink-2); max-width:60ch; margin-top:12px; font-size:16px}
.stage section{margin-top:34px}
.stage h3{
  font-size:13px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:14px; padding-bottom:9px; border-bottom:1px solid var(--line);
}

/* ---------- controls ---------- */
.opts{display:grid; gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opts.par{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:520px){ .opts.par{grid-template-columns:1fr} }
.opt{
  display:flex; gap:13px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; cursor:pointer; transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--line-strong)}
.opt .tick{
  flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line-strong);
  margin-top:2px; display:grid; place-items:center;
}
.opt.sq .tick{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt[aria-pressed="true"] .tick{border-color:var(--accent); background:var(--accent)}
.opt[aria-pressed="true"] .tick::after{content:""; width:7px; height:7px; border-radius:50%; background:var(--on-accent)}
.opt.sq[aria-pressed="true"] .tick::after{
  width:5px; height:9px; border-radius:0; background:none;
  border:solid var(--on-accent); border-width:0 2px 2px 0; transform:rotate(42deg) translate(-1px,-1px);
}
.opt strong{display:block; font-weight:600; font-size:14.5px}
.opt small{display:block; color:var(--ink-3); font-size:13px; line-height:1.45; margin-top:3px}

.rows{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface)}
.row{
  display:flex; align-items:center; gap:16px; padding:13px 16px;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .txt{flex:1; min-width:0}
.row .txt strong{display:block; font-weight:600; font-size:14.5px}
.row .txt small{color:var(--ink-3); font-size:12.5px}
.stepper{display:flex; align-items:center; gap:2px; flex:none}
.stepper button{
  width:32px; height:32px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); cursor:pointer; font-size:17px; line-height:1;
  display:grid; place-items:center; transition:background .12s;
}
.stepper button:hover:not(:disabled){background:var(--surface-2)}
.stepper button:disabled{opacity:.32; cursor:default}
.stepper output{
  min-width:38px; text-align:center; font-family:var(--mono); font-size:16px;
  font-variant-numeric:tabular-nums;
}

/* ---------- rail ---------- */
.rail{position:sticky; top:86px; display:grid; gap:14px}
@media(max-width:1000px){ .rail{position:static} }
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.rail-head{
  padding:15px 17px 13px; border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
}
.rail-head h4{font-family:var(--serif); font-size:19px}
.rail-head span{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.spec{padding:6px 17px 14px; margin:0; display:grid; gap:0}
.spec div{
  display:flex; justify-content:space-between; gap:12px; align-items:baseline;
  padding:8px 0; border-bottom:1px dotted var(--line);
}
.spec div:last-child{border-bottom:0}
.spec dt{color:var(--ink-2); font-size:13.5px}
.spec dd{margin:0; font-family:var(--mono); font-size:13.5px; font-variant-numeric:tabular-nums; text-align:right}
.spec dd i{font-style:normal; color:var(--accent); font-size:12px}
.spec .muted dd{color:var(--ink-3)}
.rail-note{
  padding:12px 17px; background:var(--surface-2); border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink-2); display:flex; gap:9px; align-items:flex-start;
  border-radius:0 0 var(--radius) var(--radius);
}
.rail-note b{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); flex:none}

/* ---------- insights ---------- */
.insight{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--ink-3);
  border-radius:var(--radius); padding:16px 18px; display:grid; gap:9px;
}
.insight.kritisk{border-left-color:var(--crit)}
.insight.anbefalet{border-left-color:var(--warn)}
.insight.info{border-left-color:var(--accent)}
.insight-top{display:flex; gap:11px; align-items:center; flex-wrap:wrap}
.tag{
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; white-space:nowrap;
}
.tag.kritisk{background:var(--crit-soft); color:var(--crit)}
.tag.anbefalet{background:var(--warn-soft); color:var(--warn)}
.tag.info{background:var(--accent-soft); color:var(--accent)}
.insight h4{font-size:16px; font-weight:600; line-height:1.3}
.insight p{color:var(--ink-2); font-size:14px; max-width:62ch}
.insight .src{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.addon{
  margin-top:4px; display:flex; align-items:center; gap:12px; justify-content:space-between;
  background:var(--surface-2); border-radius:8px; padding:11px 13px; flex-wrap:wrap;
}
.addon .lbl{font-size:13.5px; font-weight:600}
.addon .lbl small{display:block; font-weight:400; color:var(--ink-3); font-size:12.5px}
.toggle{
  border:1px solid var(--line-strong); background:var(--surface); border-radius:20px;
  padding:6px 13px 6px 9px; display:flex; align-items:center; gap:8px; cursor:pointer;
  font-size:13px; font-weight:500; white-space:nowrap;
}
.toggle .dot{width:15px; height:15px; border-radius:50%; border:1.5px solid var(--line-strong); display:grid; place-items:center}
.toggle[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-2)}
.toggle[aria-pressed="true"] .dot{background:var(--accent); border-color:var(--accent)}
.toggle[aria-pressed="true"] .dot::after{
  content:""; width:4px; height:8px; border:solid var(--on-accent); border-width:0 2px 2px 0;
  transform:rotate(42deg) translate(-1px,-1px);
}

/* ---------- price ---------- */
.pricehead{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:24px 26px; display:grid; gap:18px; box-shadow:var(--shadow);
}
.pricehead .pkg{font-family:var(--serif); font-size:clamp(24px,3vw,32px); line-height:1.15}
.pricehead .sub{color:var(--ink-2); font-size:14.5px}
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:2px; background:var(--line); border-radius:8px; overflow:hidden}
.fig{background:var(--surface); padding:14px 16px}
.fig dt{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.fig dd{margin:5px 0 0; font-size:22px; font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.fig.hero{background:var(--accent-soft)}
.fig.hero dd{color:var(--accent-2)}
.fig.save dd{color:var(--good)}
.fig small{display:block; font-size:12px; color:var(--ink-3); font-family:var(--sans); margin-top:3px}

table.lines{width:100%; border-collapse:collapse; font-size:14px}
table.lines th{
  text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); font-weight:400;
  padding:9px 10px; border-bottom:1px solid var(--line-strong);
}
table.lines td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
table.lines td.n, table.lines th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
table.lines td.was{color:var(--ink-3); text-decoration:line-through}
table.lines tr.grp td{
  background:var(--surface-2); font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2); padding:7px 10px;
}
table.lines tr.sum td{border-top:1.5px solid var(--ink); border-bottom:0; font-weight:600; font-size:15px; padding-top:12px}
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}

.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:3px; gap:3px}
.seg button{
  border:0; background:none; padding:7px 14px; border-radius:6px; cursor:pointer;
  font-size:13.5px; font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}

.slider{display:grid; gap:7px}
.slider .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.slider label{font-size:13.5px; color:var(--ink-2)}
.slider output{font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--accent)}

.case{display:grid; gap:14px; background:var(--brass-soft); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px}
.case h4{font-family:var(--serif); font-size:21px}
.case .verdict{font-size:15px; color:var(--ink); max-width:62ch}
.case .verdict b{color:var(--brass)}

/* ---------- form ---------- */
form.lead{display:grid; gap:14px; max-width:560px}
.field{display:grid; gap:6px}
.field label{font-size:13px; font-weight:600}
.field input, .field select{
  font:inherit; padding:11px 13px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); width:100%;
}
.field .hint{font-size:12.5px; color:var(--ink-3)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:560px){ .grid2{grid-template-columns:1fr} }
.consent{display:flex; gap:11px; align-items:flex-start; font-size:13.5px; color:var(--ink-2); line-height:1.5}
.consent input{margin-top:3px; width:17px; height:17px; accent-color:var(--accent); flex:none}

/* ---------- buttons ---------- */
.actions{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:32px}
.btn{
  border:1px solid transparent; border-radius:9px; padding:12px 22px; cursor:pointer;
  font-weight:600; font-size:14.5px; display:inline-flex; align-items:center; gap:9px;
  transition:background .14s, border-color .14s;
}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent; border-color:var(--line-strong); color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45; cursor:default}
.btn.primary:disabled:hover{background:var(--accent)}

.next{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.nextcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; display:grid; gap:5px;
}
.nextcard b{font-size:14.5px}
.nextcard small{color:var(--ink-3); font-size:13px; line-height:1.45}
.nextcard .go{font-family:var(--mono); font-size:11.5px; color:var(--accent); letter-spacing:.05em; margin-top:4px}

.status{font-size:13.5px; color:var(--ink-2); min-height:20px}
.status.err{color:var(--crit)}
.status.ok{color:var(--good)}

.callout{
  border:1px dashed var(--line-strong); border-radius:var(--radius); padding:14px 16px;
  font-size:13.5px; color:var(--ink-2); background:var(--surface-2);
}
.callout b{color:var(--ink)}

/* report inline */
.report{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:26px 28px; display:grid; gap:26px}
.report h3{margin-top:0}
@media print{
  .proto, .masthead, .rail, .actions, .no-print{display:none!important}
  body{background:#fff; color:#000}
  .wrap{padding:0; max-width:none}
  .bench{grid-template-columns:1fr}
  .report{border:0; padding:0}
}
</style>

<div class="proto">
  Prototype · konceptoplæg <span>Priser og produkter er eksempeldata — ikke et tilbud</span>
</div>

<header class="masthead">
  <div class="masthead-in">
    <div class="brand">
      <b>Salonbyggeren</b>
      <em>Just Add People</em>
    </div>
    <div style="display:flex; align-items:center; gap:14px">
      <span class="step-label" id="stepLabel">Trin 1 af 6</span>
      <ol class="steps" id="stepDots"></ol>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="bench">
    <main class="stage" id="stage"></main>
    <aside class="rail" id="rail"></aside>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   Salonbyggeren — prototype
   Alle produkter, priser og beregninger er EKSEMPELDATA.
   ============================================================ */

const kr = n => new Intl.NumberFormat('da-DK',{maximumFractionDigits:0}).format(Math.round(n)) + ' kr.';
const pl = (n, e, f) => n + ' ' + (n === 1 ? e : f);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- niveauer og stil ---------- */
const NIVEAUER = [
  {id:'solid',    navn:'Solid',    desc:'Gode arbejdsheste fra eget lager. Hurtig levering, ærlig pris.'},
  {id:'kvalitet', navn:'Kvalitet', desc:'Bedre polstring, mekanik og materialer. Bygget til ti år i drift.'},
  {id:'premium',  navn:'Premium',  desc:'Japansk og italiensk topklasse. Her er oplevelsen selve produktet.'}
];
const STILARTER = [
  {id:'nordisk', navn:'Lys nordisk', desc:'Ask, hvid keramik og sort stål. Roligt og let at holde rent.'},
  {id:'raa',     navn:'Rå og urban', desc:'Beton, mørkt stål og cognacfarvet læder. Markant og maskulint.'},
  {id:'japansk', navn:'Japansk ro',  desc:'Valnød, dæmpet lys og bløde former. Bygget til lange behandlinger.'}
];

/* ---------- produktkatalog (eksempeldata) ---------- */
const KATALOG = [
  {id:'stol',      navn:'Frisørstol',                  gruppe:'Klippepladser', per:'klip',      priser:{solid:[4299,3499],   kvalitet:[8995,6995],   premium:[16500,12900]}},
  {id:'spejl',     navn:'Spejlkonsol med opbevaring',  gruppe:'Klippepladser', per:'klip',      priser:{solid:[3195,2295],   kvalitet:[4795,3495],   premium:[8400,5900]}},
  {id:'rullebord', navn:'Rullebord',                   gruppe:'Klippepladser', per:'klip',      priser:{solid:[1295,995],    kvalitet:[1995,1495],   premium:[3200,2400]}},
  {id:'fodstotte', navn:'Fodstøtte',                   gruppe:'Klippepladser', per:'klip',      priser:{solid:[649,449],     kvalitet:[895,649],     premium:[1350,995]}},

  {id:'vaskeunit', navn:'Vaskeunit med keramikvask',   gruppe:'Vaskepladser',  per:'vask',      priser:{solid:[6499,4999],   kvalitet:[12900,9900],  premium:[23900,18500]}},

/* ---------- beregning ---------- */
function antal(per){
  const P = S.plan;
  if (per === 'klip') return P.klip;
  if (per === 'vask') return P.vask;
  if (per === 'farve') return P.farve;
  if (per === 'lounge') return P.lounge;
  if (per === 'loungeSet') return P.lounge > 0 ? 1 : 0;
  if (per === 'reception') return P.reception;
  if (per === 'headspa') return P.headspa;
  if (per === 'salon') return 1;
  return 0;
}

function beregn(){
  const grupper = [];
  const push = (gruppe, navn, stk, pr) => {
    if (stk <= 0) return;
    let g = grupper.find(x => x.navn === gruppe);
    if (!g) { g = {navn:gruppe, linjer:[]}; grupper.push(g); }
    g.linjer.push({navn, stk, vejl:pr[0], pris:pr[1], sumVejl:pr[0]*stk, sumPris:pr[1]*stk});
  };
  KATALOG.forEach(i => push(i.gruppe, i.navn, antal(i.per), i.priser[S.niveau]));
  TILVALG.forEach(t => { if (S.tilvalg[t.id]) push('Tilvalg fra dine indsigter', t.navn, antal(t.per), t.priser[S.niveau]); });

  let vejl = 0, pris = 0, stk = 0;
  grupper.forEach(g => g.linjer.forEach(l => { vejl += l.sumVejl; pris += l.sumPris; stk += l.stk; }));
  return {grupper, vejl, pris, stk, spar: vejl - pris};
}

function ydelse(total, mdr){
  const r = 0.084/12, rest = 100;
  const pv = total - rest/Math.pow(1+r, mdr);
  return pv * r / (1 - Math.pow(1+r, -mdr));
}

function businesscase(total){
  const ekstraKlip = Math.max(0, S.plan.klip - S.nu.klip);
  const omsKlip = ekstraKlip * S.behDag * 22 * S.bon;
  const omsHs = S.plan.headspa > 0 ? S.hsUge * 4.33 * S.hsPris : 0;
  const oms = omsKlip + omsHs;
  const dbKr = oms * S.db/100;
  const yd = ydelse(total, S.leasing);
  return {ekstraKlip, omsKlip, omsHs, oms, dbKr, yd, netto: dbKr - yd,
          maaneder: dbKr > 0 ? total/dbKr : null};
}

function synkTilvalg(){
  const aktive = indsigter();

  aktive.forEach(i => { if (i.tilvalg) gyldige[i.tilvalg] = i.vaegt !== 'info'; });

    if (!(t.id in gyldige)) { delete S.tilvalg[t.id]; return; }
    if (!S.rort[t.id]) S.tilvalg[t.id] = gyldige[t.id];
  });
}

function caseTekst(b, c){
  if (c.oms <= 0){
    return 'Du bygger ikke ekstra kapacitet ind i denne pakke — investeringen skal hentes på arbejdsmiljø, ' +
      'færre fejlbehandlinger og en salon, kunderne bliver længere i. Vil du se tallene for en ekstra plads, ' +
      'så gå tilbage og læg én til.';
  }
  const dele = [];
  if (c.omsKlip > 0) dele.push(c.ekstraKlip + ' ekstra klippeplads' + (c.ekstraKlip === 1 ? '' : 'er') + ' giver ' + kr(c.omsKlip) + ' i ekstra omsætning om måneden');
  if (c.omsHs > 0) dele.push('Head Spa lægger ' + kr(c.omsHs) + ' oveni');
  const netto = c.netto >= 0
    ? 'Det er <b>' + kr(c.netto) + ' mere om måneden</b>, end leasingydelsen koster dig — fra den første måned.'
    : 'Det dækker ikke helt ydelsen på ' + kr(c.yd) + '. Der mangler <b>' + kr(-c.netto) + ' om måneden</b> — prøv en længere løbetid, eller regn med lidt flere behandlinger.';
  const pb = c.maaneder ? ' Hele pakken er tjent hjem på cirka <b>' + Math.ceil(c.maaneder) + ' måneder</b> — alene på den ekstra kapacitet, og kun hvis den bliver booket som sat ovenfor.' : '';
  return dele.join('. ') + '. Med ' + S.db + ' % i dækningsbidrag bliver det ' + kr(c.dbKr) + ' om måneden til dig. ' + netto + pb;
}

async function hentRapport(){
  const st = document.getElementById('dlStatus');
  const navn = 'salonrapport-' + (S.lead.salon.trim() || S.lead.navn.trim() || 'salon')
    .toLowerCase().replace(/[^a-z0-9æøå]+/g, '-').replace(/^-|-$/g, '') + '.html';
  st.className = 'status no-print'; st.textContent = 'Klargør rapporten…';
  const fil = rapportFil();
  try {
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if (dl){
      await dl.save({filename: navn, data: fil});
      st.className = 'status ok no-print';
      st.textContent = 'Rapporten er hentet som ' + navn;
      return;
    }
    const url = URL.createObjectURL(new Blob([fil], {type:'text/html'}));
    const a = document.createElement('a');
    a.href = url; a.download = navn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    st.className = 'status ok no-print';
    st.textContent = 'Rapporten er hentet som ' + navn + '.';
  } catch (e){
    const kode = e && e.code ? e.code : 'ukendt';
    st.className = 'status err no-print';
    st.textContent = kode === 'declined'
      ? 'Download afbrudt. Prøv igen, eller brug "Print eller gem som PDF".'
      : 'Kunne ikke hente filen her (' + kode + '). Brug "Print eller gem som PDF" i stedet.';
  }
}

/* ---------- sidepanel ---------- */
function railHTML(){
  const raekke = (t, v, dim) => '<div' + (dim ? ' class="muted"' : '') + '><dt>' + t + '</dt><dd>' + v + '</dd></div>';
  let r = '';
  if (S.step < 3){
    r += raekke('Klippepladser i dag', S.nu.klip);
    r += raekke('Vaskepladser i dag', S.nu.vask);
    r += raekke('Inventarets alder', S.nu.alder === '16+' ? '15+ år' : S.nu.alder + ' år');
    r += raekke('Det, der presser', S.symptomer.length ? S.symptomer.length + ' punkter' : '—', !S.symptomer.length);
    r += raekke('Ambition', S.ambition.length ? S.ambition.length + ' valgt' : '—', !S.ambition.length);
  } else {
    const P = S.plan, d = P.klip - S.nu.klip;
    r += raekke('Klippepladser', P.klip + (d > 0 ? ' <i>+' + d + '</i>' : ''));
    r += raekke('Vaskepladser', P.vask);
    r += raekke('Farvebar', P.farve || '—', !P.farve);
    r += raekke('Loungepladser', P.lounge || '—', !P.lounge);
    r += raekke('Reception', P.reception || '—', !P.reception);
    r += raekke('Head Spa', P.headspa || '—', !P.headspa);
    r += raekke('Niveau', NIVEAUER.find(n => n.id === S.niveau).navn);
    r += raekke('Stil', STILARTER.find(s => s.id === S.stil).navn);
  }
  if (S.step >= 4){
    const valgt = TILVALG.filter(t => S.tilvalg[t.id]).length;
    r += raekke('Indsigter', indsigter().length);
    r += raekke('Tilvalg med i pakken', valgt || '—', !valgt);
  }
  let note = '<div class="rail-note"><b>Til sidst</b><span>Pris og pakke vises, når salonen står rigtigt. Først formen — så tallene.</span></div>';
  if (S.step >= 5){
    const b = beregn(), c = businesscase(b.pris);
    r += raekke('Dele i alt', b.stk);
    r += '<div><dt style="font-weight:600; color:var(--ink)">Din pris</dt><dd style="font-weight:600">' + kr(b.pris) + '</dd></div>';
    r += raekke('Leasing, ' + S.leasing + ' mdr.', kr(c.yd));
    note = '<div class="rail-note"><b>Ærlig pris</b><span>Du ser altid både den vejledende pris og vores. Alle beløb er ekskl. moms.</span></div>';
  }
  return '<div class="card"><div class="rail-head"><h4>Din salon</h4><span>' +
    (S.step >= 5 ? 'Samlet' : 'Tager form') + '</span></div><dl class="spec">' + r + '</dl>' + note + '</div>';
}

/* ---------- render ---------- */
function render(){
  const stage = document.getElementById('stage');
  const visning = [trinNu, trinSymptomer, trinAmbition, trinPlan, trinIndsigter, trinPris, trinLead, trinRapport][S.step];
  stage.innerHTML = visning();
  const rail = document.getElementById('rail');
  rail.innerHTML = S.step >= 7 ? '' : railHTML();
  rail.hidden = S.step >= 7;
  document.querySelector('.bench').classList.toggle('solo', S.step >= 7);

  const dots = TRIN.map((t, i) =>
    '<li class="' + (i < S.step ? 'done' : i === S.step ? 'now' : '') + '" title="' + t.navn + '"></li>').join('');
  document.getElementById('stepDots').innerHTML = dots;
  document.getElementById('stepLabel').textContent =
    S.step <= 5 ? 'Trin ' + (S.step+1) + ' af 6 · ' + TRIN[S.step].navn
    : S.step === 6 ? 'Kontaktoplysninger' : 'Rapport';
  window.scrollTo({top:0, behavior:'instant'});
}

function initPlan(){
  if (S.planInit) return;
  S.planInit = true;
  const vil = S.ambition.indexOf('kapacitet') >= 0 || S.symptomer.indexOf('ko') >= 0;
  S.plan.klip = Math.min(14, S.nu.klip + (vil ? 1 : 0));
  S.plan.vask = S.nu.vask;
  S.plan.farve = 1;
  S.plan.lounge = Math.max(2, S.nu.klip);
  S.plan.reception = 1;
  S.plan.headspa = S.ambition.indexOf('nyt') >= 0 ? 1 : 0;
}

function skift(n){
  S.step = n;
  if (S.step >= 3) initPlan();
  if (S.step >= 4) synkTilvalg();
  render();
}

/* ---------- hændelser ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, val = el.dataset.val;

  if (act === 'frem'){ skift(S.step + 1); return; }
  if (act === 'tilbage'){ skift(Math.max(0, S.step - 1)); return; }
  if (act === 'send'){ S.sendt = true; skift(7); return; }
  if (act === 'hent'){ hentRapport(); return; }
  if (act === 'print'){ window.print(); return; }
  if (act === 'omfra'){
    S.step = 0; S.planInit = false; S.sendt = false;
    S.tilvalg = {}; S.rort = {};
    S.lead = {navn:'', salon:'', email:'', tlf:'', post:'', horisont:'3-6'};
    render(); return;
  }
  if (act === 'nu' || act === 'plan'){
    const d = val.split(':'), key = d[0], delta = parseInt(d[1], 10);
    const maal = act === 'nu' ? S.nu : S.plan;
    const graenser = {klip:[act === 'nu' ? 1 : 1, act === 'nu' ? 12 : 14], vask:[0,8], farve:[0,3],
      lounge:[0,10], reception:[0,2], headspa:[0,4]};
    const g = graenser[key];
    maal[key] = Math.max(g[0], Math.min(g[1], maal[key] + delta));
    if (S.step >= 4) synkTilvalg();
    render(); return;
  }
  if (act === 'alder'){ S.nu.alder = val; render(); return; }
  if (act === 'niveau'){ S.niveau = val; render(); return; }
  if (act === 'stil'){ S.stil = val; render(); return; }
  if (act === 'sym' || act === 'amb'){
    const arr = act === 'sym' ? S.symptomer : S.ambition;
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    render(); return;
  }
  if (act === 'tilvalg'){
    S.tilvalg[val] = !S.tilvalg[val];
    S.rort[val] = true;
    render(); return;
  }
  if (act === 'addvask'){
    S.plan.vask = Math.min(8, S.plan.vask + 1);
    synkTilvalg(); render(); return;
  }
  if (act === 'leasing'){ S.leasing = parseInt(val, 10); render(); return; }
});

document.addEventListener('input', ev => {
  const s = ev.target.closest('[data-slider]');
  if (s){
    S[s.dataset.slider] = parseInt(s.value, 10);
    const b = beregn(), c = businesscase(b.pris);
    const sæt = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    sæt('outBon', kr(S.bon)); sæt('outBeh', S.behDag); sæt('outDb', S.db + ' %'); sæt('outHs', S.hsUge);
    const t = document.getElementById('caseTekst');
    if (t) t.innerHTML = caseTekst(b, c);
    return;
  }
  const f = ev.target.closest('[data-felt]');
  if (f){
    S.lead[f.dataset.felt] = f.value;
    const knap = document.querySelector('[data-act="send"]');
    if (knap) knap.disabled = !(S.lead.navn.trim().length > 1 && /.+@.+\..+/.test(S.lead.email));
  }
});

document.addEventListener('change', ev => {
  const f = ev.target.closest('select[data-felt]');
  if (f) S.lead[f.dataset.felt] = f.value;
});

render();
</script>
