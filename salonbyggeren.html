<meta charset="utf-8">
<title>Salonbyggeren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Figtree:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  /* Just Add People — hvid, varm lysegrå, sort. Grøn til besparelse, gylden til vurdering. */
  --paper:#FFFFFF;
  --tile:#F3F2F0;
  --tile-2:#EAE8E4;
  --line:#E4E2DE;
  --line-2:#CFCCC6;
  --ink:#141414;
  --ink-2:#5C5A57;
  --ink-3:#8D8A85;
  --green:#17A34A;
  --green-tile:#E6F5EC;
  --gold:#E5A02F;
  --taupe:#8A7F72;
  --r:14px;
  --pill:999px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --sans:"Figtree","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

.caps{
  font-family:var(--display); font-weight:900; font-stretch:88%;
  text-transform:uppercase; letter-spacing:-.004em; line-height:.96;
}

/* ---------- prototypebjælke ---------- */
.proto{
  background:var(--ink); color:#fff; text-align:center;
  font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.04em;
  padding:8px 20px;
}
.proto span{opacity:.6; font-weight:400}

/* ---------- masthead ---------- */
.topbar{position:sticky; top:0; z-index:40; background:var(--paper)}
.masthead{background:var(--paper)}
.masthead-in{
  max-width:1280px; margin:0 auto; padding:14px 22px;
  display:flex; align-items:center; gap:22px;
}
.menu-pill{
  display:inline-flex; align-items:center; gap:9px; background:var(--tile);
  border-radius:12px; padding:11px 16px 11px 13px; font-weight:600; font-size:14.5px; flex:none;
}
.menu-pill svg{display:block}
.wordmark{
  font-family:var(--display); font-weight:900; font-stretch:80%;
  font-size:23px; letter-spacing:-.015em; text-transform:uppercase;
  white-space:nowrap; flex:none;
}
.search{
  flex:1; max-width:640px; background:var(--tile); border-radius:var(--pill);
  padding:13px 22px; display:flex; align-items:center; gap:11px; color:var(--ink-3); font-size:15px;
}
.mh-right{display:flex; gap:22px; margin-left:auto; flex:none}
.mh-ico{display:grid; justify-items:center; gap:2px; font-size:12.5px; font-weight:500}
@media(max-width:900px){ .search, .mh-right{display:none} }

/* ---------- trinbjælke ---------- */
.stepbar{border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--paper)}
.stepbar-in{
  max-width:1280px; margin:0 auto; padding:11px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px;
}
.stepbar-in .now-label{font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--ink-2)}
.stepbar-in .steps{margin-left:auto}
.restart{
  border:1px solid var(--line-2); background:var(--paper); border-radius:var(--pill);
  padding:7px 15px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  transition:background .12s, border-color .12s, color .12s;
}
.restart:hover{border-color:var(--ink); background:var(--tile)}
.restart[data-bekraeft="ja"]{background:var(--ink); border-color:var(--ink); color:#fff}
.steps{display:flex; gap:5px; list-style:none; margin:0; padding:0}
.steps li{width:38px; height:3px; border-radius:2px; background:var(--tile-2)}
.steps li.done, .steps li.now{background:var(--ink)}
.steps li.now{box-shadow:0 0 0 3px var(--tile)}
@media(max-width:600px){ .steps{display:none} }

/* ---------- layout ---------- */
.wrap{max-width:1280px; margin:0 auto; padding:40px 22px 100px}
.bench{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:48px; align-items:start}
@media(max-width:1040px){ .bench{grid-template-columns:1fr; gap:34px} }
.bench.solo{grid-template-columns:minmax(0,1fr)}
.bench.solo .stage{max-width:940px; margin:0 auto}

.eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:16px}
.stage h2{
  font-family:var(--display); font-weight:900; font-stretch:88%;
  text-transform:uppercase; letter-spacing:-.006em; line-height:.97;
  font-size:clamp(34px,5.2vw,60px);
}
.lede{color:var(--ink-2); max-width:62ch; margin-top:16px; font-size:16.5px}
.stage section{margin-top:40px}
.stage h3{
  font-size:20px; font-weight:700; letter-spacing:-.01em; margin-bottom:16px;
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
}
.stage h3 em{font-style:normal; font-size:13.5px; font-weight:500; color:var(--ink-3)}

/* ---------- valgkort ---------- */
.opts{display:grid; gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opts.par{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:520px){ .opts.par{grid-template-columns:1fr} }
.opt{
  display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%;
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 18px; cursor:pointer; transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--line-2); background:var(--tile)}
.opt .tick{
  flex:none; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-2);
  margin-top:1px; display:grid; place-items:center; background:var(--paper);
}
.opt.sq .tick{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--ink); background:var(--tile)}
.opt[aria-pressed="true"] .tick{border-color:var(--ink); background:var(--ink)}
.opt[aria-pressed="true"] .tick::after{content:""; width:7px; height:7px; border-radius:50%; background:#fff}
.opt.sq[aria-pressed="true"] .tick::after{
  width:5px; height:9px; border-radius:0; background:none;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg) translate(-1px,-1px);
}
.opt strong{display:block; font-weight:600; font-size:15px}
.opt small{display:block; color:var(--ink-3); font-size:13.5px; line-height:1.45; margin-top:4px}

/* ---------- pladsrækker med kategoricirkler ---------- */
.rows{display:grid; gap:10px}
.row{
  display:flex; align-items:center; gap:16px; padding:13px 18px 13px 13px;
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
}
.circ{
  width:62px; height:62px; border-radius:50%; background:var(--tile);
  display:grid; place-items:center; flex:none;
}
.circ svg{display:block; width:38px; height:38px}
.row .txt{flex:1; min-width:0}
.row .txt strong{display:block; font-weight:600; font-size:15px}
.row .txt small{color:var(--ink-3); font-size:13px}
.stepper{display:flex; align-items:center; gap:4px; flex:none}
.stepper button{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line-2);
  background:var(--paper); cursor:pointer; font-size:18px; line-height:1;
  display:grid; place-items:center; transition:background .12s, border-color .12s;
}
.stepper button:hover:not(:disabled){background:var(--ink); border-color:var(--ink); color:#fff}
.stepper button:disabled{opacity:.3; cursor:default}
.stepper output{min-width:36px; text-align:center; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums}

/* ---------- sidepanel ---------- */
.rail{position:sticky; top:132px; display:grid; gap:14px}
/* Sidepanelet hører til den brede visning. Stablet under trinnet forvirrer det mere, end det hjælper. */
@media(max-width:1040px){ .rail{display:none} }
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.rail-head{padding:18px 20px 14px; display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.rail-head h4{font-size:19px; font-weight:700; letter-spacing:-.01em}
.rail-head span{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.spec{padding:0 20px 16px; margin:0}
.spec div{display:flex; justify-content:space-between; gap:12px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line)}
.spec div:last-child{border-bottom:0}
.spec dt{color:var(--ink-2); font-size:14px}
.spec dd{margin:0; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right}
.spec dd i{font-style:normal; color:var(--green); font-size:12.5px}
.spec .muted dd{color:var(--ink-3); font-weight:400}
.rail-note{padding:14px 20px; background:var(--tile); font-size:13px; color:var(--ink-2)}
.rail-note b{display:block; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); margin-bottom:3px}

/* ---------- fold-ud-indsigter undervejs ---------- */
.kvik{
  background:var(--tile); border-radius:12px; padding:15px 18px; margin-top:-3px;
  display:grid; gap:7px; border-left:3px solid var(--ink);
}
.kvik.advar{border-left-color:var(--gold)}
.kvik b{font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3)}
.kvik p{font-size:14.5px; color:var(--ink); line-height:1.5; max-width:60ch}
.kvik .mini{
  justify-self:start; margin-top:4px; border:1px solid var(--ink); background:var(--paper);
  border-radius:var(--pill); padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer;
}
.kvik .mini:hover{background:var(--ink); color:#fff}
.kvik.ny{animation:fold .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes fold{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none}}

/* ---------- indsigter ---------- */
.insight{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; display:grid; gap:10px}
.insight-top{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.tag{font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:5px 12px; border-radius:var(--pill); white-space:nowrap}
.tag.kritisk{background:var(--ink); color:#fff}
.tag.anbefalet{background:var(--tile-2); color:var(--ink)}
.tag.info{background:var(--paper); color:var(--ink-2); border:1px solid var(--line)}
.insight .src{font-size:12.5px; color:var(--ink-3)}
.insight h4{font-size:19px; font-weight:700; letter-spacing:-.012em; line-height:1.25}
.insight p{color:var(--ink-2); font-size:15px; max-width:64ch}
.addon{
  margin-top:6px; display:flex; align-items:center; gap:14px; justify-content:space-between;
  background:var(--tile); border-radius:12px; padding:13px 15px; flex-wrap:wrap;
}
.addon .lbl{font-size:14px; font-weight:600}
.addon .lbl small{display:block; font-weight:400; color:var(--ink-3); font-size:13px}
.toggle{
  border:1px solid var(--line-2); background:var(--paper); border-radius:var(--pill);
  padding:9px 17px 9px 12px; display:flex; align-items:center; gap:9px; cursor:pointer;
  font-size:13.5px; font-weight:600; white-space:nowrap; transition:background .12s;
}
.toggle .dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line-2); display:grid; place-items:center}
.toggle:hover{border-color:var(--ink)}
.toggle[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:#fff}
.toggle[aria-pressed="true"] .dot{background:#fff; border-color:#fff}
.toggle[aria-pressed="true"] .dot::after{
  content:""; width:4px; height:8px; border:solid var(--ink); border-width:0 2px 2px 0;
  transform:rotate(42deg) translate(-1px,-1px);
}

/* ---------- pris ---------- */
.pricehead{background:var(--tile); border-radius:var(--r); padding:30px 32px; display:grid; gap:22px}
.pricehead .pkg{font-family:var(--serif); font-size:clamp(26px,3.4vw,38px); line-height:1.12; letter-spacing:-.01em}
.pricehead .sub{color:var(--ink-2); font-size:15px; margin-top:6px}
.pricetag{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.pricetag b{font-size:clamp(34px,4.6vw,50px); font-weight:800; letter-spacing:-.025em; line-height:1; font-variant-numeric:tabular-nums}
.pricetag s{color:var(--ink-3); font-size:20px; font-weight:500}
.badge{background:var(--green); color:#fff; font-size:14px; font-weight:700; padding:5px 11px; border-radius:8px}
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px}
.fig{background:var(--paper); border-radius:12px; padding:16px 18px}
.fig dt{font-size:12.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3)}
.fig dd{margin:7px 0 0; font-size:24px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.fig small{display:block; font-size:12.5px; color:var(--ink-3); margin-top:3px; font-weight:400}
.fig.save dd{color:var(--green)}

.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r)}
table.lines{width:100%; border-collapse:collapse; font-size:14.5px; background:var(--paper)}
table.lines th{
  text-align:left; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--line);
}
table.lines td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
table.lines td.n, table.lines th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
table.lines td.was{color:var(--ink-3); text-decoration:line-through}
table.lines tr.grp td{background:var(--tile); font-size:12px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; padding:9px 14px}
table.lines tr.sum td{border-top:2px solid var(--ink); border-bottom:0; font-weight:700; font-size:16px; padding-top:14px}

.seg{display:inline-flex; background:var(--tile); border-radius:var(--pill); padding:4px; gap:4px}
.seg button{border:0; background:none; padding:9px 18px; border-radius:var(--pill); cursor:pointer; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff}

.case{display:grid; gap:16px; background:var(--tile); border-radius:var(--r); padding:26px 28px}
.case h4{font-family:var(--serif); font-size:24px; font-weight:600; letter-spacing:-.01em}
.slider{display:grid; gap:8px}
.slider .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.slider label{font-size:14px; color:var(--ink-2)}
.slider output{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--ink)}
.verdict{font-size:15.5px; color:var(--ink); max-width:64ch; line-height:1.6}
.verdict b{font-weight:700}

/* ---------- formular ---------- */
form.lead{display:grid; gap:16px; max-width:580px}
.field{display:grid; gap:7px}
.field label{font-size:13.5px; font-weight:600}
.field input, .field select{
  font:inherit; padding:13px 16px; border-radius:12px; border:1px solid var(--line-2);
  background:var(--paper); color:var(--ink); width:100%;
}
.field input::placeholder{color:var(--ink-3)}
.field .hint{font-size:12.5px; color:var(--ink-3)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:560px){ .grid2{grid-template-columns:1fr} }
.consent{display:flex; gap:12px; align-items:flex-start; font-size:14px; color:var(--ink-2); line-height:1.5}
.consent input{margin-top:3px; width:18px; height:18px; accent-color:var(--ink); flex:none}

/* ---------- knapper ---------- */
.actions{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:38px}
.btn{
  border:1px solid var(--ink); border-radius:var(--pill); padding:14px 28px; cursor:pointer;
  font-weight:600; font-size:15px; display:inline-flex; align-items:center; gap:9px; transition:background .14s, color .14s;
}
.btn.primary{background:var(--ink); color:#fff}
.btn.primary:hover{background:#000}
.btn.ghost{background:var(--paper); color:var(--ink)}
.btn.ghost:hover{background:var(--tile)}
.btn:disabled{opacity:.35; cursor:default}

.next{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.nextcard{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; display:grid; gap:6px}
.nextcard b{font-size:16px; font-weight:700; letter-spacing:-.01em}
.nextcard small{color:var(--ink-3); font-size:13.5px; line-height:1.5}
.nextcard .go{font-size:13.5px; font-weight:600; color:var(--taupe); text-decoration:underline; text-underline-offset:3px; margin-top:6px}

.status{font-size:14px; color:var(--ink-2); min-height:22px; margin-top:6px}
.status.err{color:#B3261E}
.status.ok{color:var(--green)}
.callout{border:1px solid var(--line); background:var(--tile); border-radius:var(--r); padding:16px 18px; font-size:14px; color:var(--ink-2)}
.callout b{color:var(--ink)}

/* ---------- rapport ---------- */
.report{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:34px 36px; display:grid; gap:30px}
.report h3{font-size:13px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:14px; display:block}
.report .rtitle{font-family:var(--serif); font-size:32px; font-weight:600; letter-spacing:-.015em; line-height:1.15}
@media(max-width:560px){ .report{padding:24px 20px} }
@media print{
  .proto, .masthead, .stepbar, .rail, .actions, .no-print{display:none!important}
  body{background:#fff}
  .wrap{padding:0; max-width:none}
  .bench{grid-template-columns:1fr}
  .report{border:0; padding:0}
}
</style>

<div class="proto">Prototype · konceptoplæg &nbsp;<span>Produkter og priser er eksempeldata — ikke et tilbud</span></div>

<div class="topbar">
<header class="masthead">
  <div class="masthead-in">
    <span class="menu-pill">
      <svg width="19" height="14" viewBox="0 0 19 14" fill="none" aria-hidden="true"><path d="M0 1h19M0 7h19M0 13h19" stroke="#141414" stroke-width="1.8"/></svg>
      Menu
    </span>
    <b class="wordmark">Just Add People</b>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.6" stroke="#8D8A85" stroke-width="1.7"/><path d="M11.4 11.4L16 16" stroke="#8D8A85" stroke-width="1.7" stroke-linecap="round"/></svg>
      Søg her
    </div>
    <div class="mh-right">
      <span class="mh-ico">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 18s6-5.2 6-10A6 6 0 004 8c0 4.8 6 10 6 10z" stroke="#141414" stroke-width="1.6"/><circle cx="10" cy="8" r="2.1" stroke="#141414" stroke-width="1.6"/></svg>
        Showroom
      </span>
      <span class="mh-ico">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.4 6h13.2l-1 11.5a1 1 0 01-1 .9H5.4a1 1 0 01-1-.9L3.4 6z" stroke="#141414" stroke-width="1.6"/><path d="M7 7.5V5a3 3 0 016 0v2.5" stroke="#141414" stroke-width="1.6"/></svg>
        Kurv
      </span>
    </div>
  </div>
</header>

<div class="stepbar">
  <div class="stepbar-in">
    <span class="now-label" id="stepLabel">Trin 1 af 6</span>
    <ol class="steps" id="stepDots"></ol>
    <button class="restart" id="restart" data-act="omfra">Start forfra</button>
  </div>
</div>
</div>

<div class="wrap">
  <div class="bench">
    <main class="stage" id="stage"></main>
    <aside class="rail" id="rail"></aside>
  </div>
</div>
<script>
"use strict";

/* ============================================================
   Salonbyggeren — prototype
   Alle produkter, priser og beregninger er EKSEMPELDATA.
   ============================================================ */

const kr = n => new Intl.NumberFormat('da-DK',{maximumFractionDigits:0}).format(Math.round(n)) + ' kr.';

/* ---------- beregning ---------- */
function antal(per){
  const P = S.plan;
  if (per === 'klip') return P.klip;
  if (per === 'vask') return P.vask;
  if (per === 'farve') return P.farve;
  if (per === 'lounge') return P.lounge;
  if (per === 'loungeSet') return P.lounge > 0 ? 1 : 0;
  if (per === 'reception') return P.reception;
  if (per === 'headspa') return P.headspa;
  if (per === 'salon') return 1;
  return 0;
}

function beregn(){
  const grupper = [];
  const push = (gruppe, navn, stk, pr) => {
    if (stk <= 0) return;
    let g = grupper.find(x => x.navn === gruppe);
    if (!g) { g = {navn:gruppe, linjer:[]}; grupper.push(g); }
    g.linjer.push({navn, stk, vejl:pr[0], pris:pr[1], sumVejl:pr[0]*stk, sumPris:pr[1]*stk});
  };
  KATALOG.forEach(i => push(i.gruppe, i.navn, antal(i.per), i.priser[S.niveau]));
  TILVALG.forEach(t => { if (S.tilvalg[t.id]) push('Tilvalg fra dine indsigter', t.navn, antal(t.per), t.priser[S.niveau]); });

  let vejl = 0, pris = 0, stk = 0;
  grupper.forEach(g => g.linjer.forEach(l => { vejl += l.sumVejl; pris += l.sumPris; stk += l.stk; }));
  return {grupper, vejl, pris, stk, spar: vejl - pris};
}

function ydelse(total, mdr){
  const r = 0.084/12, rest = 100;
  const pv = total - rest/Math.pow(1+r, mdr);
  return pv * r / (1 - Math.pow(1+r, -mdr));
}

function businesscase(total){
  const ekstraKlip = Math.max(0, S.plan.klip - S.nu.klip);
  const omsKlip = ekstraKlip * S.behDag * 22 * S.bon;
  const omsHs = S.plan.headspa > 0 ? S.hsUge * 4.33 * S.hsPris : 0;
  const oms = omsKlip + omsHs;
  const dbKr = oms * S.db/100;
  const yd = ydelse(total, S.leasing);
  return {ekstraKlip, omsKlip, omsHs, oms, dbKr, yd, netto: dbKr - yd,
          maaneder: dbKr > 0 ? total/dbKr : null};
}

function synkTilvalg(){
  const aktive = indsigter();
  const gyldige = {};
  aktive.forEach(i => { if (i.tilvalg) gyldige[i.tilvalg] = i.vaegt !== 'info'; });
  TILVALG.forEach(t => {
    if (!(t.id in gyldige)) { delete S.tilvalg[t.id]; return; }
    if (!S.rort[t.id]) S.tilvalg[t.id] = gyldige[t.id];
  });
}

function caseTekst(b, c){
  if (c.oms <= 0){
    return 'Du bygger ikke ekstra kapacitet ind i denne pakke — investeringen skal hentes på arbejdsmiljø, ' +
      'færre fejlbehandlinger og en salon, kunderne bliver længere i. Vil du se tallene for en ekstra plads, ' +
      'så gå tilbage og læg én til.';
  }
  const dele = [];
  if (c.omsKlip > 0) dele.push(c.ekstraKlip + ' ekstra klippeplads' + (c.ekstraKlip === 1 ? '' : 'er') + ' giver ' + kr(c.omsKlip) + ' i ekstra omsætning om måneden');
  if (c.omsHs > 0) dele.push('Head Spa lægger ' + kr(c.omsHs) + ' oveni');
  const netto = c.netto >= 0
    ? 'Det er <b>' + kr(c.netto) + ' mere om måneden</b>, end leasingydelsen koster dig — fra den første måned.'
    : 'Det dækker ikke helt ydelsen på ' + kr(c.yd) + '. Der mangler <b>' + kr(-c.netto) + ' om måneden</b> — prøv en længere løbetid, eller regn med lidt flere behandlinger.';
  const pb = c.maaneder ? ' Hele pakken er tjent hjem på cirka <b>' + Math.ceil(c.maaneder) + ' måneder</b> — alene på den ekstra kapacitet, og kun hvis den bliver booket som sat ovenfor.' : '';
  return dele.join('. ') + '. Med ' + S.db + ' % i dækningsbidrag bliver det ' + kr(c.dbKr) + ' om måneden til dig. ' + netto + pb;
}

  '<div><h3>Pakke og pris</h3><div class="scroll"><table class="lines">' +
    '<thead><tr><th>Vare</th><th class="n">Stk.</th><th class="n">Vejledende</th><th class="n">Din pris</th></tr></thead>' +
    '<tbody>' + rk.join('') + '</tbody></table></div></div>' +

  '<div><h3>Økonomi</h3><dl class="figs">' +
    '<div class="fig"><dt>Din pris</dt><dd>' + kr(b.pris) + '</dd><small>ekskl. moms</small></div>' +
    '<div class="fig save"><dt>Under vejledende</dt><dd>' + kr(b.spar) + '</dd><small>' + Math.round(b.spar/b.vejl*100) + ' %</small></div>' +
    '<div class="fig"><dt>Leasing</dt><dd>' + kr(c.yd) + '</dd><small>pr. md. i ' + S.leasing + ' mdr.</small></div>' +
    (c.dbKr > 0 ? '<div class="fig"><dt>Ekstra dækningsbidrag</dt><dd>' + kr(c.dbKr) + '</dd><small>pr. måned</small></div>' : '') +
  '</dl><p class="verdict" style="margin-top:14px">' + caseTekst(b, c) + '</p></div>' +

  '<div><h3>Næste skridt</h3><ul style="margin:0; padding-left:20px; color:var(--ink-2); line-height:1.8">' +
    '<li>Book en gratis fremvisning — vi kører ud med stolene, så de kan prøves i din egen salon.</li>' +
    '<li>Besøg showroomet på Mariendalsvej 32, 8800 Viborg. Hverdage 9-16, personlig rundvisning.</li>' +
    '<li>Søg finansiering: 12-48 måneder, 100 kr. i restværdi, svar på kreditgodkendelse samme dag.</li>' +
  '</ul></div>' +

  '<div class="callout"><b>Om tallene:</b> Denne rapport er lavet i en prototype. Produktnavne og priser er eksempeldata, ' +
    'og beregningen af leasing og business case er vejledende — ikke et tilbud. Alle beløb er ekskl. moms. ' +
    'Beregningen forudsætter 22 åbningsdage om måneden og ' + S.db + ' % dækningsbidrag efter produkter og løn.</div>';
}

function rapportFil(){
  const titel = 'Salonrapport · ' + (S.lead.salon.trim() || 'Din salon');
  const css = document.querySelector('style').textContent;
  return '<!doctype html><html lang="da"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<title>' + esc(titel) + '</title>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=IBM+Plex+Mono:wght@400;500&display=swap">' +
    '<style>' + css + '\nbody{padding:40px 24px}\n.wrap{max-width:820px}\n</style></head><body>' +
    '<div class="wrap"><div class="report">' + rapportKrop() + '</div>' +
    '<p class="lede" style="font-size:12.5px; margin-top:28px">Salonbyggeren · prototype · ' +
    new Date().toLocaleDateString('da-DK') + '</p></div></body></html>';
}

async function hentRapport(){
  const st = document.getElementById('dlStatus');
  const navn = 'salonrapport-' + (S.lead.salon.trim() || S.lead.navn.trim() || 'salon')
    .toLowerCase().replace(/[^a-z0-9æøå]+/g, '-').replace(/^-|-$/g, '') + '.html';
  st.className = 'status no-print'; st.textContent = 'Klargør rapporten…';
  const fil = rapportFil();
  try {
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if (dl){
      await dl.save({filename: navn, data: fil});
      st.className = 'status ok no-print';
      st.textContent = 'Rapporten er hentet som ' + navn;
      return;
    }
    const url = URL.createObjectURL(new Blob([fil], {type:'text/html'}));
    const a = document.createElement('a');
    a.href = url; a.download = navn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    st.className = 'status ok no-print';
    st.textContent = 'Rapporten er hentet som ' + navn + '.';
  } catch (e){
    const kode = e && e.code ? e.code : 'ukendt';
    st.className = 'status err no-print';
    st.textContent = kode === 'declined'
      ? 'Download afbrudt. Prøv igen, eller brug "Print eller gem som PDF".'
      : 'Kunne ikke hente filen her (' + kode + '). Brug "Print eller gem som PDF" i stedet.';
  }
}

/* ---------- sidepanel ---------- */
function railHTML(){
  const raekke = (t, v, dim) => '<div' + (dim ? ' class="muted"' : '') + '><dt>' + t + '</dt><dd>' + v + '</dd></div>';
  let r = '';
  if (S.step < 3){
    r += raekke('Klippepladser i dag', S.nu.klip);
    r += raekke('Vaskepladser i dag', S.nu.vask);
    r += raekke('Inventarets alder', S.nu.alder === '16+' ? '15+ år' : S.nu.alder + ' år');
    r += raekke('Det, der presser', S.symptomer.length ? S.symptomer.length + ' punkter' : '—', !S.symptomer.length);
    r += raekke('Ambition', S.ambition.length ? S.ambition.length + ' valgt' : '—', !S.ambition.length);
  } else {
    const P = S.plan, d = P.klip - S.nu.klip;
    r += raekke('Klippepladser', P.klip + (d > 0 ? ' <i>+' + d + '</i>' : ''));
    r += raekke('Vaskepladser', P.vask);
    r += raekke('Farvebar', P.farve || '—', !P.farve);
    r += raekke('Loungepladser', P.lounge || '—', !P.lounge);
    r += raekke('Reception', P.reception || '—', !P.reception);
    r += raekke('Head Spa', P.headspa || '—', !P.headspa);
    r += raekke('Niveau', NIVEAUER.find(n => n.id === S.niveau).navn);
    r += raekke('Stil', STILARTER.find(s => s.id === S.stil).navn);
  }
  if (S.step >= 4){
    const valgt = TILVALG.filter(t => S.tilvalg[t.id]).length;
    r += raekke('Indsigter', indsigter().length);
    r += raekke('Tilvalg med i pakken', valgt || '—', !valgt);
  }
  let note = '<div class="rail-note"><b>Til sidst</b><span>Pris og pakke vises, når salonen står rigtigt. Først formen — så tallene.</span></div>';
  if (S.step >= 5){
    const b = beregn(), c = businesscase(b.pris);
    r += raekke('Dele i alt', b.stk);
    r += '<div><dt style="font-weight:600; color:var(--ink)">Din pris</dt><dd style="font-weight:600">' + kr(b.pris) + '</dd></div>';
    r += raekke('Leasing, ' + S.leasing + ' mdr.', kr(c.yd));
    note = '<div class="rail-note"><b>Ærlig pris</b><span>Du ser altid både den vejledende pris og vores. Alle beløb er ekskl. moms.</span></div>';
  }
  return '<div class="card"><div class="rail-head"><h4>Din salon</h4><span>' +
    (S.step >= 5 ? 'Samlet' : 'Tager form') + '</span></div><dl class="spec">' + r + '</dl>' + note + '</div>';
}

/* ---------- render ---------- */
function render(){
  const stage = document.getElementById('stage');
  const visning = [trinNu, trinSymptomer, trinAmbition, trinPlan, trinIndsigter, trinPris, trinLead, trinRapport][S.step];
  stage.innerHTML = visning();
  const rail = document.getElementById('rail');
  rail.innerHTML = S.step >= 7 ? '' : railHTML();
  rail.hidden = S.step >= 7;
  document.querySelector('.bench').classList.toggle('solo', S.step >= 7);

  const dots = TRIN.map((t, i) =>
    '<li class="' + (i < S.step ? 'done' : i === S.step ? 'now' : '') + '" title="' + t.navn + '"></li>').join('');
  document.getElementById('stepDots').innerHTML = dots;
  const rb = document.getElementById('restart');
  rb.textContent = S.bekraeft ? 'Sikker? Klik igen' : 'Start forfra';
  rb.dataset.bekraeft = S.bekraeft ? 'ja' : 'nej';
  document.getElementById('stepLabel').textContent =
    S.step <= 5 ? 'Trin ' + (S.step+1) + ' af 6 · ' + TRIN[S.step].navn
    : S.step === 6 ? 'Kontaktoplysninger' : 'Rapport';
  window.scrollTo({top:0, behavior:'instant'});
}

function initPlan(){
  if (S.planInit) return;
  S.planInit = true;
  const vil = S.ambition.indexOf('kapacitet') >= 0 || S.symptomer.indexOf('ko') >= 0;
  S.plan.klip = Math.min(14, S.nu.klip + (vil ? 1 : 0));
  S.plan.vask = S.nu.vask;
  S.plan.farve = 1;
  S.plan.lounge = Math.max(2, S.nu.klip);
  S.plan.reception = 1;
  S.plan.headspa = S.ambition.indexOf('nyt') >= 0 ? 1 : 0;
}

function skift(n){
  S.step = n;
  if (S.step >= 3) initPlan();
  if (S.step >= 4) synkTilvalg();
  render();
}

/* ---------- hændelser ---------- */
let bekraeftTimer = null;

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, val = el.dataset.val;
  if (act !== 'omfra' && S.bekraeft){ S.bekraeft = false; clearTimeout(bekraeftTimer); }

  if (act === 'frem'){ skift(S.step + 1); return; }
  if (act === 'tilbage'){ skift(Math.max(0, S.step - 1)); return; }
  if (act === 'send'){ S.sendt = true; skift(7); return; }
  if (act === 'hent'){ hentRapport(); return; }
  if (act === 'print'){ window.print(); return; }
  if (act === 'omfra'){
    if (!S.bekraeft){
      S.bekraeft = true;
      clearTimeout(bekraeftTimer);
      bekraeftTimer = setTimeout(() => { S.bekraeft = false; render(); }, 4000);
      const rb = document.getElementById('restart');
      rb.textContent = 'Sikker? Klik igen'; rb.dataset.bekraeft = 'ja';
      return;
    }
    clearTimeout(bekraeftTimer);
    S.step = 0; S.planInit = false; S.sendt = false; S.bekraeft = false; S.senest = null;
    S.nu = {klip:2, vask:1, alder:'6-10'};
    S.symptomer = ['ryg','ko']; S.ambition = ['kapacitet'];
    S.plan = {klip:3, vask:2, farve:1, lounge:3, reception:1, headspa:0};
    S.niveau = 'kvalitet'; S.stil = 'nordisk'; S.leasing = 36;
    S.bon = 520; S.behDag = 4; S.db = 40; S.hsUge = 5;
    S.tilvalg = {}; S.rort = {};
    S.lead = {navn:'', salon:'', email:'', tlf:'', post:'', horisont:'3-6'};
    render(); return;
  }
  if (act === 'nu' || act === 'plan'){
    const d = val.split(':'), key = d[0], delta = parseInt(d[1], 10);
    S.senest = act + ':' + key;
    const maal = act === 'nu' ? S.nu : S.plan;
    const graenser = {klip:[act === 'nu' ? 1 : 1, act === 'nu' ? 12 : 14], vask:[0,8], farve:[0,3],
      lounge:[0,10], reception:[0,2], headspa:[0,4]};
    const g = graenser[key];
    maal[key] = Math.max(g[0], Math.min(g[1], maal[key] + delta));
    if (S.step >= 4) synkTilvalg();
    render(); return;
  }
  if (act === 'alder'){ S.nu.alder = val; render(); return; }
  if (act === 'niveau'){ S.niveau = val; S.senest = 'niveau:' + val; render(); return; }
  if (act === 'stil'){ S.stil = val; S.senest = 'stil:' + val; render(); return; }
  if (act === 'sym' || act === 'amb'){
    const arr = act === 'sym' ? S.symptomer : S.ambition;
    const i = arr.indexOf(val);
    if (i >= 0) { arr.splice(i, 1); S.senest = null; } else { arr.push(val); S.senest = act + ':' + val; }
    render(); return;
  }
  if (act === 'tilvalg'){
    S.tilvalg[val] = !S.tilvalg[val];
    S.rort[val] = true;
    render(); return;
  }
  if (act === 'addvask'){
    S.senest = 'plan:vask';
    S.plan.vask = Math.min(8, S.plan.vask + 1);
    synkTilvalg(); render(); return;
  }
  if (act === 'leasing'){ S.leasing = parseInt(val, 10); render(); return; }
});

document.addEventListener('input', ev => {
  const s = ev.target.closest('[data-slider]');
  if (s){
    S[s.dataset.slider] = parseInt(s.value, 10);
    const b = beregn(), c = businesscase(b.pris);
    const sæt = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    sæt('outBon', kr(S.bon)); sæt('outBeh', S.behDag); sæt('outDb', S.db + ' %'); sæt('outHs', S.hsUge);
    const t = document.getElementById('caseTekst');
    if (t) t.innerHTML = caseTekst(b, c);
    return;
  }
  const f = ev.target.closest('[data-felt]');
  if (f){
    S.lead[f.dataset.felt] = f.value;
    const knap = document.querySelector('[data-act="send"]');
    if (knap) knap.disabled = !(S.lead.navn.trim().length > 1 && /.+@.+\..+/.test(S.lead.email));
  }
});

document.addEventListener('change', ev => {
  const f = ev.target.closest('select[data-felt]');
  if (f) S.lead[f.dataset.felt] = f.value;
});

render();
</script>
